services:
  postgres-metastore:
    image: postgres:16-alpine
    container_name: keuangan-postgres-metastore
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_metastore_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-metastore}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse_net

  minio:
    image: minio/minio:latest
    container_name: keuangan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse_net

  minio-init:
    image: minio/mc:latest
    container_name: keuangan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-lakehouse};
      mc anonymous set none local/${MINIO_BUCKET:-lakehouse};
      "
    networks:
      - lakehouse_net

  spark-master:
    image: apache/spark:3.5.6
    container_name: keuangan-spark-master
    restart: unless-stopped
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
      ]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./:/opt/lakehouse
      - spark_warehouse:/opt/spark/warehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse_net

  spark-worker:
    image: apache/spark:3.5.6
    container_name: keuangan-spark-worker
    restart: unless-stopped
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--memory",
        "2G",
        "--cores",
        "2",
      ]
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/lakehouse
      - spark_warehouse:/opt/spark/warehouse
    networks:
      - lakehouse_net

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: keuangan-airflow-init
    depends_on:
      postgres-metastore:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-4}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres-metastore:5432/${POSTGRES_DB:-metastore}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/requirements.txt"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      PORTAL_TARGET_PRODI: ${PORTAL_TARGET_PRODI:-Sains Data}
      PORTAL_TARGET_FAKULTAS: ${PORTAL_TARGET_FAKULTAS:-Fakultas Sains}
      PORTAL_TARGET_TAHUN_AKADEMIK: ${PORTAL_TARGET_TAHUN_AKADEMIK:-2023/2024}
      PORTAL_TARGET_TAHUN_ANGGARAN: ${PORTAL_TARGET_TAHUN_ANGGARAN:-2024}
      PORTAL_SOURCE_EVENT_ISO: ${PORTAL_SOURCE_EVENT_ISO:-2026-05-26T10:00:00+00:00}
      PORTAL_TARGET_TOTAL_PAGU_RAB: ${PORTAL_TARGET_TOTAL_PAGU_RAB:-150000000}
      PORTAL_RAB_FILENAME: ${PORTAL_RAB_FILENAME:-}
      PORTAL_SILVER_RAB_FILENAME: ${PORTAL_SILVER_RAB_FILENAME:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_UPLOAD_ENABLED: ${MINIO_UPLOAD_ENABLED:-false}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    networks:
      - lakehouse_net

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: keuangan-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-4}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres-metastore:5432/${POSTGRES_DB:-metastore}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/requirements.txt"
      PORTAL_TARGET_PRODI: ${PORTAL_TARGET_PRODI:-Sains Data}
      PORTAL_TARGET_FAKULTAS: ${PORTAL_TARGET_FAKULTAS:-Fakultas Sains}
      PORTAL_TARGET_TAHUN_AKADEMIK: ${PORTAL_TARGET_TAHUN_AKADEMIK:-2023/2024}
      PORTAL_TARGET_TAHUN_ANGGARAN: ${PORTAL_TARGET_TAHUN_ANGGARAN:-2024}
      PORTAL_SOURCE_EVENT_ISO: ${PORTAL_SOURCE_EVENT_ISO:-2026-05-26T10:00:00+00:00}
      PORTAL_TARGET_TOTAL_PAGU_RAB: ${PORTAL_TARGET_TOTAL_PAGU_RAB:-150000000}
      PORTAL_RAB_FILENAME: ${PORTAL_RAB_FILENAME:-}
      PORTAL_SILVER_RAB_FILENAME: ${PORTAL_SILVER_RAB_FILENAME:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_UPLOAD_ENABLED: ${MINIO_UPLOAD_ENABLED:-false}
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8085:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}" || curl --fail http://localhost:8080/health',
        ]
      interval: 20s
      timeout: 10s
      retries: 12
    networks:
      - lakehouse_net

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: keuangan-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-4}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres-metastore:5432/${POSTGRES_DB:-metastore}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/requirements.txt"
      PORTAL_TARGET_PRODI: ${PORTAL_TARGET_PRODI:-Sains Data}
      PORTAL_TARGET_FAKULTAS: ${PORTAL_TARGET_FAKULTAS:-Fakultas Sains}
      PORTAL_TARGET_TAHUN_AKADEMIK: ${PORTAL_TARGET_TAHUN_AKADEMIK:-2023/2024}
      PORTAL_TARGET_TAHUN_ANGGARAN: ${PORTAL_TARGET_TAHUN_ANGGARAN:-2024}
      PORTAL_SOURCE_EVENT_ISO: ${PORTAL_SOURCE_EVENT_ISO:-2026-05-26T10:00:00+00:00}
      PORTAL_TARGET_TOTAL_PAGU_RAB: ${PORTAL_TARGET_TOTAL_PAGU_RAB:-150000000}
      PORTAL_RAB_FILENAME: ${PORTAL_RAB_FILENAME:-}
      PORTAL_SILVER_RAB_FILENAME: ${PORTAL_SILVER_RAB_FILENAME:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_UPLOAD_ENABLED: ${MINIO_UPLOAD_ENABLED:-false}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - lakehouse_net

  trino:
    image: trinodb/trino:474
    container_name: keuangan-trino
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres-metastore:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/etc:/etc/trino/custom
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse_net

  superset:
    image: apache/superset:4.1.1
    container_name: keuangan-superset
    restart: unless-stopped
    depends_on:
      trino:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_this_secret}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8089:8088"
    volumes:
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    command: >
      /bin/sh -c "
      pip install trino sqlalchemy-trino &&
      superset db upgrade &&
      superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Admin --lastname User --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    networks:
      - lakehouse_net

  portal-backend:
    build:
      context: .
      dockerfile: Dockerfile.portal
    image: keuangan-portal:latest
    container_name: keuangan-portal-backend
    restart: unless-stopped
    depends_on:
      airflow-webserver:
        condition: service_healthy
      superset:
        condition: service_healthy
      trino:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres-metastore:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/lakehouse
      PORTAL_BACKEND_BIND_HOST: 0.0.0.0
      PORTAL_BACKEND_BIND_PORT: 8091
      PORTAL_GUNICORN_WORKERS: ${PORTAL_GUNICORN_WORKERS:-2}
      PORTAL_GUNICORN_THREADS: ${PORTAL_GUNICORN_THREADS:-4}
      PORTAL_GUNICORN_TIMEOUT: ${PORTAL_GUNICORN_TIMEOUT:-120}
      PORTAL_TARGET_PRODI: ${PORTAL_TARGET_PRODI:-Sains Data}
      PORTAL_TARGET_FAKULTAS: ${PORTAL_TARGET_FAKULTAS:-Fakultas Sains}
      PORTAL_TARGET_TAHUN_AKADEMIK: ${PORTAL_TARGET_TAHUN_AKADEMIK:-2023/2024}
      PORTAL_TARGET_TAHUN_ANGGARAN: ${PORTAL_TARGET_TAHUN_ANGGARAN:-2024}
      PORTAL_SOURCE_EVENT_ISO: ${PORTAL_SOURCE_EVENT_ISO:-2026-05-26T10:00:00+00:00}
      PORTAL_TARGET_TOTAL_PAGU_RAB: ${PORTAL_TARGET_TOTAL_PAGU_RAB:-150000000}
      PORTAL_RAB_FILENAME: ${PORTAL_RAB_FILENAME:-}
      PORTAL_SILVER_RAB_FILENAME: ${PORTAL_SILVER_RAB_FILENAME:-}
      PORTAL_HOST: portal-frontend
      PORTAL_PORT: 8090
      PORTAL_BACKEND_HOST: portal-backend
      PORTAL_BACKEND_PORT: 8091
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_PORT: 8080
      SUPERSET_HOST: superset
      SUPERSET_PORT: 8088
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_UI_PORT: 8080
      SPARK_WORKER_HOST: spark-worker
      SPARK_WORKER_UI_PORT: 8081
      TRINO_HOST: trino
      TRINO_PORT: 8080
      POSTGRES_HOST: postgres-metastore
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_UPLOAD_ENABLED: ${MINIO_UPLOAD_ENABLED:-false}
    ports:
      - "8091:8091"
    volumes:
      - ./:/opt/lakehouse
    working_dir: /opt/lakehouse
    entrypoint: /bin/sh
    command: >
      -c "gunicorn portal_backend.app:app
      --bind 0.0.0.0:8091
      --workers $${PORTAL_GUNICORN_WORKERS}
      --threads $${PORTAL_GUNICORN_THREADS}
      --timeout $${PORTAL_GUNICORN_TIMEOUT}
      --access-logfile -
      --error-logfile -"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8091/api/health', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 12
    networks:
      - lakehouse_net

  portal-frontend:
    image: keuangan-portal:latest
    container_name: keuangan-portal-frontend
    restart: unless-stopped
    depends_on:
      portal-backend:
        condition: service_healthy
    environment:
      PORTAL_HOST: 0.0.0.0
      PORTAL_PORT: 8090
      PORTAL_TARGET_PRODI: ${PORTAL_TARGET_PRODI:-Sains Data}
      PORTAL_TARGET_FAKULTAS: ${PORTAL_TARGET_FAKULTAS:-Fakultas Sains}
      PORTAL_TARGET_TAHUN_AKADEMIK: ${PORTAL_TARGET_TAHUN_AKADEMIK:-2023/2024}
      PORTAL_TARGET_TAHUN_ANGGARAN: ${PORTAL_TARGET_TAHUN_ANGGARAN:-2024}
      PORTAL_SOURCE_EVENT_ISO: ${PORTAL_SOURCE_EVENT_ISO:-2026-05-26T10:00:00+00:00}
      PORTAL_TARGET_TOTAL_PAGU_RAB: ${PORTAL_TARGET_TOTAL_PAGU_RAB:-150000000}
      PORTAL_RAB_FILENAME: ${PORTAL_RAB_FILENAME:-}
      PORTAL_SILVER_RAB_FILENAME: ${PORTAL_SILVER_RAB_FILENAME:-}
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_PORT: 8080
      SUPERSET_HOST: superset
      SUPERSET_PORT: 8088
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_UI_PORT: 8080
      SPARK_WORKER_HOST: spark-worker
      SPARK_WORKER_UI_PORT: 8081
      TRINO_HOST: trino
      TRINO_PORT: 8080
      POSTGRES_HOST: postgres-metastore
      POSTGRES_PORT: 5432
      PORTAL_BACKEND_HOST: portal-backend
      PORTAL_BACKEND_PORT: 8091
    ports:
      - "8090:8090"
    volumes:
      - ./:/opt/lakehouse
    working_dir: /opt/lakehouse
    entrypoint: python
    command: -m portal.server
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 12
    networks:
      - lakehouse_net

networks:
  lakehouse_net:
    name: lakehouse_net

volumes:
  postgres_metastore_data:
  minio_data:
  airflow_logs:
  spark_warehouse:
  superset_home:
