<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004e9f;
      --primary-container: #0066cc;
      --on-primary: #ffffff;
      --on-primary-container: #dfe8ff;
      --surface: #f9f9fb;
      --surface-low: #f3f3f5;
      --surface-high: #e8e8ea;
      --surface-highest: #e2e2e4;
      --on-surface: #1a1c1d;
      --on-surface-variant: #414753;
      --outline: #727784;
      --outline-variant: #c1c6d5;
      --success: #15803d;
      --warning: #b45309;
      --error: #ba1a1a;
      --sidebar-width: 18rem;
      --footer-height: 40px;
    }

    * { box-sizing: border-box; }
    html { width: 100%; min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--on-surface);
      background: linear-gradient(180deg, #f9f9fb 0%, #e8e8ea 100%);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .62; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .icon-fill { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }

    .app-shell { min-height: 100vh; }
    .app-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      width: var(--sidebar-width);
      height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      background: rgba(255, 255, 255, .72);
      border-right: 1px solid rgba(193, 198, 213, .22);
      box-shadow: 0 10px 40px rgba(26, 28, 29, .04), 0 2px 10px rgba(26, 28, 29, .02);
      backdrop-filter: blur(22px);
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: var(--on-primary);
      background: linear-gradient(135deg, var(--primary), var(--primary-container));
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(0, 78, 159, .18);
    }
    .brand-title { margin: 0; font-size: 1.08rem; line-height: 1.15; font-weight: 800; letter-spacing: 0; }
    .brand-subtitle { margin: .3rem 0 0; color: var(--on-surface-variant); font-size: .8rem; line-height: 1.35; }
    .nav-list { display: grid; gap: .45rem; }
    .nav-item {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .72rem .9rem;
      color: var(--on-surface-variant);
      border-radius: .75rem;
      border: 1px solid transparent;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .nav-item:hover { background: var(--surface-low); color: var(--on-surface); }
    .nav-item.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      box-shadow: 0 12px 28px rgba(0, 102, 204, .16);
    }
    .nav-item span:last-child { font-weight: 600; font-size: .93rem; }
    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(193, 198, 213, .22); }
    .admin-card { display: flex; align-items: center; gap: .75rem; margin-bottom: .85rem; color: var(--on-surface-variant); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--primary); background: #d7e3ff; }

    .app-main {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      padding-bottom: var(--footer-height);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, .62);
      border-bottom: 1px solid rgba(193, 198, 213, .24);
      box-shadow: 0 10px 40px rgba(26, 28, 29, .035);
      backdrop-filter: blur(18px);
    }
    .page-title { margin: 0; font-size: clamp(1.55rem, 2vw, 2.15rem); line-height: 1.08; font-weight: 800; letter-spacing: 0; }
    .page-description { margin: .35rem 0 0; color: var(--on-surface-variant); line-height: 1.5; max-width: 760px; }
    .header-actions { display: flex; align-items: center; gap: .7rem; }
    .search-box {
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .8rem;
      border-radius: 999px;
      border: 1px solid rgba(193, 198, 213, .28);
      background: rgba(255, 255, 255, .7);
    }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--on-surface); }
    .icon-button {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(193, 198, 213, .24);
      border-radius: 999px;
      color: var(--on-surface-variant);
      background: rgba(255, 255, 255, .62);
    }
    .content {
      flex: 1;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 1.5rem 2rem calc(var(--footer-height) + 2.5rem);
    }
    .page { display: none; }
    .page.active { display: block; }
    .section-grid { display: grid; gap: 1.25rem; min-width: 0; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .home-metrics-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .data-quality-grid { grid-template-columns: minmax(340px, .36fr) minmax(720px, .64fr); align-items: start; }
    .dashboard-metrics-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .dashboard-flow-grid { grid-template-columns: minmax(800px, .7fr) minmax(360px, .3fr); align-items: start; }
    .orchestration-summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(360px, 2fr); }
    .orchestration-body-grid { grid-template-columns: minmax(850px, .7fr) minmax(360px, .3fr); align-items: start; }
    .system-services-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .analytics-top-grid { grid-template-columns: minmax(760px, .65fr) minmax(380px, .35fr); align-items: start; }
    .lakehouse-validation-grid { grid-template-columns: minmax(620px, 1fr) minmax(620px, 1fr); align-items: start; }

    .glass-card, .glass-panel, .metric-card, .service-card {
      min-width: 0;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(193, 198, 213, .2);
      border-top-color: rgba(255, 255, 255, .74);
      border-radius: 1.125rem;
      box-shadow: 0 10px 40px rgba(26, 28, 29, .045), 0 2px 10px rgba(26, 28, 29, .025);
      backdrop-filter: blur(14px);
    }
    .glass-card, .glass-panel { padding: 1.35rem; }
    .metric-card { min-height: 142px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .metric-label { display: flex; justify-content: space-between; gap: 1rem; color: var(--on-surface-variant); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .metric-value { margin-top: .9rem; font-size: clamp(1.45rem, 1.4vw, 2.2rem); line-height: 1.12; font-weight: 800; letter-spacing: 0; overflow-wrap: anywhere; }
    .metric-note { margin-top: .45rem; color: var(--on-surface-variant); font-size: .85rem; line-height: 1.45; }
    .section-title { margin: 0 0 1rem; font-size: 1.08rem; font-weight: 800; letter-spacing: 0; }
    .muted { color: var(--on-surface-variant); }
    .small { font-size: .84rem; }
    .divider { height: 1px; background: rgba(193, 198, 213, .28); margin: 1rem 0; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      width: fit-content;
      padding: .32rem .58rem;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .status-ok { color: #166534; background: #dcfce7; }
    .status-warn { color: #854d0e; background: #fef3c7; }
    .status-error { color: #991b1b; background: #fee2e2; }
    .status-info { color: #1e3a8a; background: #dbeafe; }
    .primary-button, .secondary-button, .disabled-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      padding: .62rem .9rem;
      border-radius: .65rem;
      border: 1px solid transparent;
      font-size: .88rem;
      font-weight: 750;
      white-space: nowrap;
    }
    .primary-button { color: var(--on-primary); background: var(--primary); box-shadow: 0 10px 24px rgba(0, 78, 159, .14); }
    .secondary-button { color: var(--primary); background: rgba(255, 255, 255, .62); border-color: rgba(193, 198, 213, .34); }
    .disabled-button { color: var(--on-surface-variant); background: var(--surface-low); border-color: rgba(193, 198, 213, .28); }
    .table-wrap { overflow-x: auto; max-width: 100%; border-radius: .75rem; border: 1px solid rgba(193, 198, 213, .18); }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .table-preview table { min-width: 960px; }
    .table-wide table { min-width: 900px; }
    .table-compact table { min-width: 460px; }
    th, td { padding: .88rem .95rem; text-align: left; border-bottom: 1px solid rgba(193, 198, 213, .18); vertical-align: top; }
    th { color: var(--on-surface-variant); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
    td { font-size: .9rem; }
    tr:last-child td { border-bottom: 0; }
    code { font-family: Consolas, "Courier New", monospace; font-size: .82rem; overflow-wrap: anywhere; }

    .pipeline-flow, .lineage-flow { position: relative; overflow-x: auto; max-width: 100%; padding: 1rem .25rem 1.6rem; }
    .pipeline-track {
      position: absolute;
      left: 2rem;
      right: 2rem;
      top: 46px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      min-width: 900px;
    }
    .pipeline-nodes { position: relative; z-index: 1; min-width: 900px; display: flex; justify-content: space-between; gap: 1.25rem; }
    .pipeline-node { display: grid; justify-items: center; gap: .65rem; width: 104px; text-align: center; }
    .node-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: white;
      background: #22c55e;
      border: 4px solid rgba(255, 255, 255, .9);
      box-shadow: 0 8px 22px rgba(34, 197, 94, .22);
    }
    .node-label { font-size: .78rem; font-weight: 800; }
    .lineage-sources { display: grid; gap: .55rem; min-width: 130px; }
    .source-pill { padding: .55rem .7rem; border-radius: .7rem; background: rgba(255,255,255,.72); border: 1px solid rgba(193,198,213,.24); font-weight: 700; font-size: .82rem; text-align: center; }

    .upload-zone {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      text-align: center;
      border: 2px dashed rgba(0, 78, 159, .34);
    }
    .upload-zone .material-symbols-outlined { font-size: 2.4rem; color: var(--primary); }
    .empty-state {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      color: var(--on-surface-variant);
      background: rgba(255,255,255,.5);
      border: 1px dashed rgba(114,119,132,.34);
      border-radius: .75rem;
    }
    .service-card { padding: 1.2rem; display: flex; flex-direction: column; gap: .95rem; min-height: 260px; }
    .service-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .service-name { margin: 0; font-size: 1rem; font-weight: 800; }
    .kv { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: .45rem .7rem; font-size: .84rem; }
    .kv dt { color: var(--on-surface-variant); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .card-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: auto; }

    .uat-item { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 1rem; align-items: start; padding: 1rem 0; border-bottom: 1px solid rgba(193,198,213,.2); }
    .uat-item:last-child { border-bottom: 0; }
    .uat-question { margin: .35rem 0 .75rem; color: var(--on-surface-variant); line-height: 1.5; }
    .uat-item textarea { width: 100%; min-height: 74px; resize: vertical; border-radius: .65rem; border: 1px solid rgba(193,198,213,.34); padding: .75rem; background: rgba(255,255,255,.7); }
    .rating { display: grid; gap: .45rem; }
    .rating select { min-height: 40px; border-radius: .65rem; border: 1px solid rgba(193,198,213,.34); background: rgba(255,255,255,.75); padding: .45rem .55rem; }
    .logs-panel {
      height: 300px;
      border-radius: .75rem;
      padding: 1rem;
      color: #e5e7eb;
      background: #242628;
      font-family: Consolas, "Courier New", monospace;
      font-size: .8rem;
      overflow: auto;
    }
    .log-row { display: grid; grid-template-columns: 82px 70px 1fr; gap: .7rem; padding: .25rem 0; }
    .app-footer {
      position: fixed;
      left: var(--sidebar-width);
      right: 0;
      bottom: 0;
      z-index: 35;
      height: var(--footer-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 2rem;
      background: rgba(255, 255, 255, .86);
      border-top: 1px solid rgba(193, 198, 213, .28);
      box-shadow: 0 -8px 24px rgba(26, 28, 29, .04);
      backdrop-filter: blur(14px);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }
    .footer-left, .footer-right { display: flex; align-items: center; gap: 1.5rem; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,.65); }
    .toast {
      position: fixed;
      right: 1.2rem;
      bottom: 3.5rem;
      z-index: 80;
      padding: .75rem 1rem;
      color: white;
      background: #202124;
      border-radius: .75rem;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .dag-name-value {
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(.95rem, 1vw, 1.2rem);
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .control-panel {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .control-actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; }

    @media (max-width: 1535px) {
      .home-metrics-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .system-services-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 1279px) {
      .dashboard-flow-grid, .orchestration-body-grid, .analytics-top-grid, .data-quality-grid, .lakehouse-validation-grid { grid-template-columns: 1fr; }
      .dashboard-metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .orchestration-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .system-services-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .control-actions { justify-content: flex-start; }
    }
    @media (max-width: 1100px) {
      .grid-4, .grid-5, .home-metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-3 { grid-column: span 2; }
      .header-actions .search-box { display: none; }
    }
    @media (max-width: 820px) {
      :root { --sidebar-width: 0px; }
      .app-sidebar {
        position: sticky;
        width: 100%;
        height: auto;
        padding: 1rem;
        border-right: 0;
        border-bottom: 1px solid rgba(193,198,213,.24);
      }
      .nav-list { display: flex; overflow-x: auto; padding-bottom: .25rem; }
      .nav-item { min-width: max-content; }
      .sidebar-footer { display: none; }
      .app-main { margin-left: 0; }
      .app-header { padding: 1rem; align-items: flex-start; }
      .content { padding: 1rem 1rem calc(var(--footer-height) + 2rem); }
      .grid-2, .grid-3, .grid-4, .grid-5, .home-metrics-grid, .dashboard-metrics-grid, .orchestration-summary-grid, .system-services-grid { grid-template-columns: 1fr; }
      .span-2, .span-3 { grid-column: span 1; }
      .app-footer { left: 0; padding: 0 .8rem; font-size: .58rem; }
      .footer-right { gap: .7rem; }
      .uat-item { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .header-actions { display: none; }
      .app-footer { justify-content: center; }
      .footer-right { display: none; }
      .kv { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="Navigasi utama">
      <div style="display:flex; gap:.8rem; align-items:center;">
        <div class="brand-mark"><span class="material-symbols-outlined icon-fill">account_balance</span></div>
        <div>
          <h1 class="brand-title">Portal Keuangan</h1>
          <p class="brand-subtitle">Monitoring Data Keuangan Prodi</p>
        </div>
      </div>
      <nav class="nav-list" id="navList"></nav>
      <div class="sidebar-footer">
        <div class="admin-card">
          <div class="avatar"><span class="material-symbols-outlined">account_circle</span></div>
          <div>
            <strong style="display:block;font-size:.9rem;">System Admin</strong>
            <span class="small">Administrator</span>
          </div>
        </div>
        <button class="primary-button" style="width:100%;"><span class="material-symbols-outlined">security</span>Admin Mode</button>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-header">
        <div>
          <h2 class="page-title" id="pageTitle">Beranda</h2>
          <p class="page-description" id="pageDescription"></p>
        </div>
        <div class="header-actions">
          <label class="search-box" aria-label="Cari data">
            <span class="material-symbols-outlined">search</span>
            <input type="search" placeholder="Cari data...">
          </label>
          <button class="icon-button" title="Notifikasi"><span class="material-symbols-outlined">notifications</span></button>
          <button class="icon-button" title="Profil admin"><span class="material-symbols-outlined">account_circle</span></button>
        </div>
      </header>

      <div class="content">
        <section class="page" data-page="beranda" id="page-beranda"></section>
        <section class="page" data-page="data" id="page-data"></section>
        <section class="page" data-page="dashboard" id="page-dashboard"></section>
        <section class="page" data-page="lakehouse" id="page-lakehouse"></section>
        <section class="page" data-page="orkestrasi" id="page-orkestrasi"></section>
        <section class="page" data-page="analytics" id="page-analytics"></section>
        <section class="page" data-page="system" id="page-system"></section>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-left"><span class="dot" id="footerStatusDot"></span><span id="footerSystemStatus">SYSTEM STATUS: LOADING</span></div>
      <div class="footer-right">
        <span><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">storage</span> <span id="footerLakehouseStatus">LAKEHOUSE: CHECKING</span></span>
        <span><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">update</span> <span id="footerPipelineStatus">LAST PIPELINE RUN: CHECKING</span></span>
      </div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite">Disalin</div>

  <script>
    const CONTROL = {
      totalPiutang: 31250000,
      penunggak: 15,
      paguRab: 150000000,
      totalRows: 800,
      validRows: 784,
      rejectedRows: 16,
      dropoutRate: 2,
      qualityScore: 100,
      lastRun: "26 Mei 2026, 10:42 WIB",
      dashboardUrl: "http://localhost:8089/superset/dashboard/dashboard-piutang-ukt-prodi/"
    };
    const API_BASE_URL = "http://localhost:8091";

    const pages = [
      ["beranda", "Beranda", "home", "Ringkasan kondisi data keuangan, status pipeline, dan aktivitas sistem terbaru."],
      ["data", "Data", "database", "Upload, validasi, preview, dan riwayat file sumber keuangan."],
      ["dashboard", "Dashboard", "dashboard", "Monitoring kualitas data, performa pipeline, dan status dashboard analitik."],
      ["lakehouse", "Lakehouse", "waves", "Observasi layer Bronze, Silver, Gold, lineage, dan validasi data mart."],
      ["orkestrasi", "Orkestrasi", "sync_alt", "Monitoring DAG, task pipeline, execution flow, dan logs proses."],
      ["analytics", "Analytics", "analytics", "Visualisasi Superset, evaluasi UAT, dan ringkasan penilaian pengguna."],
      ["system", "System", "settings", "Service lokal, status infrastruktur, port, credential, dan audit trail."]
    ];

    const state = {
      metrics: {},

      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remaining = Math.floor(seconds % 60);
      if (hours) return `${hours}j ${minutes}m ${remaining}d`;
      if (minutes) return `${minutes}m ${remaining}d`;
      return `${remaining} detik`;
    };

    function formatActivityTime(value) {
      if (!value) return null;
      const normalized = String(value).replace(" ", "T");
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return value;
      const parts = Object.fromEntries(new Intl.DateTimeFormat("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
        timeZone: "Asia/Jakarta"
      }).formatToParts(date).map(part => [part.type, part.value]));
      return `${parts.day} ${parts.month} ${parts.year}, ${parts.hour}:${parts.minute} WIB`;
    }

              ${logRow("10:32:10", "SUCCESS", "Quality Gate selesai: 784 valid rows, 16 rejected rows")}
              ${logRow("10:35:42", "SUCCESS", "Bronze layer ingestion completed")}
              ${logRow("10:42:00", "SUCCESS", "Gold validation PASS: Rp31.250.000 dan 15 penunggak")}
              ${logRow("10:45:12", "INFO", "Superset dashboard refresh requested")}
              `}
            </div>
          </section>
        </div>`;
    }

    function logRow(time, level, text) {
      return `<div class="log-row"><span style="color:#9ca3af;">[${time}]</span><span style="color:${level === "SUCCESS" ? "#86efac" : "#93c5fd"}">${level}</span><span>${text}</span></div>`;
    }

    function renderAnalytics() {
      const uat = state.metrics.uat || {};

        ["Navigation Facility", "Indikator utama proposal", "Apakah filter prodi, semester, dan status piutang mudah digunakan?"],

        ["Data Consistency", "Tambahan internal", "Apakah rincian mahasiswa, status kualitas, dan nominal piutang tampil konsisten tanpa duplikasi?"]

        <div class="section-grid" style="gap:1.5rem;">
          <section class="section-grid analytics-top-grid">
            <div class="glass-panel">
              <h3 class="section-title">Superset Status</h3>
              <p class="muted">Dashboard analitik piutang UKT Prodi terhubung ke dataset <strong>vw_dashboard_piutang_ukt</strong>.</p>
              <div class="divider"></div>
              <div style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;">
                ${badge(state.services.superset ? "Online" : "Offline", state.services.superset ? "ok" : "error")}
                <a class="primary-button" href="${CONTROL.dashboardUrl}" target="_blank" rel="noreferrer"><span class="material-symbols-outlined">open_in_new</span>Buka Superset Dashboard</a>
              </div>
            </div>
            <div class="glass-panel">
              <h3 class="section-title">UAT Score Summary</h3>
              <div class="metric-value" style="color:var(--primary);">${uat.average_score ?? "4.6"}</div>
              <p class="metric-note">${uat.category || "Sangat baik"} | ${uat.response_count || 15} responden</p>
            </div>
          </section>
          <section class="glass-panel">
            <h3 class="section-title">UAT Form</h3>
            <form>${aspects.map(([title, tag, question], index) => `
              <div class="uat-item">
                <div>
                  <strong>${index + 1}. ${title}</strong>
                  <div class="small muted">${tag}</div>
                  <p class="uat-question">${question}</p>
                  <textarea placeholder="Catatan opsional"></textarea>
                </div>
                <label class="rating"><span class="small muted">Rating 1-5</span><select><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
              </div>`).join("")}
              <div style="display:flex;justify-content:flex-end;margin-top:1rem;"><button type="button" class="secondary-button" id="uatSubmit">Submit UAT dummy</button></div>
            </form>
          </section>
          <section class="glass-panel">
            <h3 class="section-title">UAT History</h3>
            ${activityTable(rowsFromActivities() || [
              ["26 Mei 2026", "Evaluasi dashboard oleh pengguna prodi", "Sangat baik", "15 responden"],
              ["26 Mei 2026", "Template UAT dibuat", "Ready", "System"]
            ])}
          </section>
        </div>`;
    }

    function renderSystem() {
      const services = [
        { name: "Airflow", role: "Orkestrasi DAG", key: "airflow", hostPort: "8085", containerPort: "8080", url: "http://localhost:8085", cred: "airflow / airflow", action: "Open" },
        { name: "Superset", role: "BI Dashboard", key: "superset", hostPort: "8089", containerPort: "8088", url: "http://localhost:8089", cred: "admin / admin", action: "Open" },
        { name: "MinIO API", role: "Object Storage API Health", key: "minioApi", hostPort: "9000", containerPort: "9000", url: "http://localhost:9000/minio/health/live", cred: "-", action: "Open Health" },
        { name: "MinIO Console", role: "Object Storage Console", key: "minioConsole", hostPort: "9001", containerPort: "9001", url: "http://localhost:9001", cred: "minioadmin / minioadmin", action: "Open" },
        { name: "Spark Master", role: "Compute Master UI", key: "sparkMaster", hostPort: "8080", containerPort: "8080", url: "http://localhost:8080", cred: "-", action: "Open" },
        { name: "Spark Master RPC", role: "Compute Master TCP", key: "sparkRpc", hostPort: "7077", containerPort: "7077", url: "localhost:7077", cred: "-", action: "Copy Connection", copy: "spark://localhost:7077" },
        { name: "Spark Worker", role: "Compute Worker UI", key: "sparkWorker", hostPort: "8081", containerPort: "8081", url: "http://localhost:8081", cred: "-", action: "Open" },
        { name: "Trino", role: "SQL Query Engine", key: "trino", hostPort: "8082", containerPort: "8080", url: "http://localhost:8082/v1/info", cred: "-", action: "Open Info" },
        { name: "PostgreSQL Metastore", role: "Metadata Database", key: "postgres", hostPort: "5432", containerPort: "5432", url: "localhost:5432", cred: "lakehouse / lakehouse | DB metastore", action: "Copy Connection", copy: "Host=localhost;Port=5432;Database=metastore;Username=lakehouse;Password=lakehouse" },
        { name: "Portal Keuangan", role: "Portal Lokal", key: "portal", hostPort: "8090", containerPort: "8090", url: "http://localhost:8090", cred: "-", action: "Open" },
        { name: "Portal Backend API", role: "Backend Lokal", key: "portalBackend", hostPort: "8091", containerPort: "8091", url: "http://localhost:8091/api/health", cred: "-", action: "Open Health" }
      ];
      const source = state.sourceStatus || {};
      const ref = state.referenceSummary || {};
      document.getElementById("page-system").innerHTML = `
        <div class="section-grid" style="gap:1.5rem;">
          <section class="section-grid system-services-grid">
            ${services.map(serviceCard).join("")}
          </section>
          <section class="section-grid grid-3">
            ${sourceStatusCard("PDF Audited", source.pdf || state.pdfStatus, "picture_as_pdf", "Status sample proposal main.pdf")}
            ${sourceStatusCard("CSV Transaksi", source.csv, "csv", "Status dua file transaksi dummy")}
            ${sourceStatusCard("Excel RAB", source.excel, "table_chart", "Status file RAB Prodi Sains Data")}
          </section>
          <section class="section-grid grid-4">
            ${metric("PDF Sample", ref.pdf_sample?.available ? "Available" : "Missing", "data/samples/ITERA_LKTA2024Audited.pdf", "picture_as_pdf")}
            ${metric("Master UKT CSV", ref.ukt?.available ? "Available" : "Missing", `${ref.ukt?.rows || 0} rows`, "school")}
            ${metric("Master SPI CSV", ref.spi?.available ? "Available" : "Missing", `${ref.spi?.rows || 0} rows`, "payments")}
            ${metric("Master Biaya Excel", ref.excel?.master_biaya_available ? "Available" : "Missing", "data/raw/excel/master_biaya_itera.xlsx", "table_chart")}
          </section>
          <section class="glass-panel">
            <h3 class="section-title">Audit Trail Infrastruktur</h3>
            ${activityTable([
              ["26 Mei 2026", "Portal lokal tersedia di port 8090", "Operational", "Portal"],
              ["26 Mei 2026", "Superset host menggunakan port 8089", "Configured", "Docker Compose"],
              ["26 Mei 2026", "PostgreSQL metastore memakai database metastore", "Configured", "PostgreSQL"]
            ])}
          </section>
        </div>`;
    }

    function serviceCard(service) {
      const online = state.services[service.key];
      const hostPort = service.hostPort || service.port;
      const containerPort = service.containerPort || service.port;
      return `<article class="service-card">
        <div class="service-head">
          <div><h3 class="service-name">${service.name}</h3><p class="muted small" style="margin:.25rem 0 0;">${service.role}</p></div>
          ${badge(online ? "Online" : "Offline", online ? "ok" : "warn")}
        </div>
        <dl class="kv">
          <dt>Uptime</dt><dd>${online ? "Aktif" : "Belum terdeteksi"}</dd>
          <dt>Host Port</dt><dd><code>${hostPort}</code></dd>
          <dt>Container Port</dt><dd><code>${containerPort}</code></dd>
          <dt>URL</dt><dd><code>${service.url}</code></dd>
          <dt>Credential</dt><dd>${service.cred}</dd>
        </dl>
        <div class="card-actions">
          ${service.copy ? `<button class="secondary-button" data-copy="${service.copy}"><span class="material-symbols-outlined">content_copy</span>${service.action}</button>` : `<a class="primary-button" href="${service.openUrl || service.url}" target="_blank" rel="noreferrer"><span class="material-symbols-outlined">open_in_new</span>${service.action}</a>`}
          ${service.name === "Superset" ? `<a class="secondary-button" href="${CONTROL.dashboardUrl}" target="_blank" rel="noreferrer">Dashboard</a>` : ""}
        </div>
      </article>`;
    }

    function activityTable(rows, tableClass = "table-wide") {
      return `<div class="table-wrap ${tableClass}"><table><thead><tr><th>Waktu</th><th>Aktivitas</th><th>Status</th><th>Sumber</th></tr></thead><tbody>
        ${rows.map(row => `<tr><td>${row[0]}</td><td><strong>${row[1]}</strong></td><td>${row[2]}</td><td class="muted">${row[3]}</td></tr>`).join("")}
      </tbody></table></div>`;
    }

    function rowsFromActivities() {
      if (!state.activities.length) return null;
      return state.activities.slice(0, 6).map(item => [
        item.time || "-",
        item.message || item.action || "-",
        item.status || "-",
        item.source || item.actor || "system"
      ]);
    }

    function dataTable(rows) {
      if (!rows.length) return emptyState();
      const columns = Object.keys(rows[0]).slice(0, 6);
      return `<div class="table-wrap table-preview"><table><thead><tr>${columns.map(col => `<th>${col}</th>`).join("")}</tr></thead><tbody>
        ${rows.map(row => `<tr>${columns.map(col => `<td>${safe(row[col])}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
    }

    function renderAll() {
      renderBeranda();
      renderData();
      renderDashboard();
      renderLakehouse();
      renderOrkestrasi();
      renderAnalytics();
      renderSystem();
      renderFooterStatus();
      bindCopyButtons();
      bindUploadButtons();
      bindPipelineButtons();
      bindUatSubmit();
    }

    function setRoute() {
      const route = (location.hash || "#/beranda").replace(/^#\/?/, "");
      const page = pages.find(([id]) => id === route) || pages[0];
      document.querySelectorAll(".page").forEach(el => el.classList.toggle("active", el.dataset.page === page[0]));
      document.querySelectorAll(".nav-item").forEach(el => {
        const active = el.dataset.nav === page[0];
        el.classList.toggle("active", active);
        el.querySelector(".material-symbols-outlined").classList.toggle("icon-fill", active);
      });
      document.getElementById("pageTitle").textContent = page[1];
      document.getElementById("pageDescription").textContent = page[3];
      document.title = `Portal Keuangan - ${page[1]}`;
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast("Disalin");
    }

    function bindCopyButtons() {
      document.querySelectorAll("[data-copy]").forEach(button => {
        button.addEventListener("click", () => copyText(button.getAttribute("data-copy")));
      });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE_URL}${path}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`GET ${path} gagal (${response.status})`);
      return response.json();
    }

    async function apiPost(path, body) {
      const options = { method: "POST" };
      if (body instanceof FormData) {
        options.body = body;
      } else if (body) {
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(body);
      }
      const response = await fetch(`${API_BASE_URL}${path}`, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || `POST ${path} gagal (${response.status})`);
      return payload;
    }

    function tablePayloadToObjects(payload) {
      if (!payload || !payload.available || !Array.isArray(payload.columns)) return [];
      return payload.rows.map(row => Object.fromEntries(payload.columns.map((column, index) => [column, row[index]])));
    }

    function serviceListToMap(payload) {
      const services = payload.services || [];
      state.serviceList = services;
      return Object.fromEntries(services.map(service => [service.key, service.status === "online"]));
    }

    function bindUploadButtons() {
      document.querySelectorAll("[data-upload]").forEach(button => {
        button.addEventListener("click", async () => {
          const type = button.getAttribute("data-upload");
          const input = document.getElementById(`upload-${type}`);
          if (!input.files.length) {
            showToast("Pilih file dummy terlebih dahulu");
            return;
          }
          const formData = new FormData();
          formData.append("file", input.files[0]);
          button.disabled = true;
          button.textContent = "Uploading...";
          try {
            const result = await apiPost(`/api/upload/${type}`, formData);
            state.lastAction = `Upload ${type}: ${result.status}`;
            showToast(`Upload ${type} berhasil`);
            await loadState();
          } catch (error) {
            showToast(error.message);
            button.disabled = false;
            button.innerHTML = `<span class="material-symbols-outlined">upload_file</span>Upload dummy`;
          }
        });
      });
    }

    function bindPipelineButtons() {
      document.querySelectorAll("[data-pipeline]").forEach(button => {
        button.addEventListener("click", async () => {
          const pipeline = button.getAttribute("data-pipeline");
          button.disabled = true;
          const old = button.innerHTML;
          button.textContent = "Running...";
          try {
            const result = await apiPost(`/api/pipeline/${pipeline}`, pipeline === "full-run-basic" ? { mode: "local-basic" } : null);
            state.lastAction = `${pipeline}: ${result.status}`;
            showToast(`${pipeline} ${result.status}`);
            await loadState();
          } catch (error) {
            state.lastAction = `${pipeline}: failed`;
            showToast(error.message);
            button.disabled = false;
            button.innerHTML = old;
          }
        });
      });
    }

    function bindUatSubmit() {
      const button = document.getElementById("uatSubmit");
      if (!button) return;
      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "Submitting...";
        try {
          await apiPost("/api/uat/submit", { mode: "dummy" });
          state.lastAction = "UAT dummy: success";
          showToast("UAT dummy terkirim");
          await loadState();
        } catch (error) {
          showToast(error.message);
          button.disabled = false;
          button.textContent = "Submit UAT dummy";
        }
      });
    }

    async function loadState() {
      try {
        const [metrics, services, activity, lakehouse, rejected, goldPreview, silverPreview, sourceStatus, pdfStatus, referenceSummary] = await Promise.all([
          apiGet("/api/metrics"),
          apiGet("/api/status/services"),
          apiGet("/api/activity"),
          apiGet("/api/lakehouse/summary"),
          apiGet("/api/data/rejected-rows?limit=25"),
          apiGet("/api/data/preview?layer=gold&limit=10").catch(() => null),
          apiGet("/api/data/preview?layer=silver&limit=10").catch(() => null),
          apiGet("/api/data/source-status").catch(() => null),
          apiGet("/api/pdf/sample-status").catch(() => null),
          apiGet("/api/reference/summary").catch(() => null)
        ]);
        state.metrics = metrics.raw || {};
        state.metrics.qualityGate = state.metrics.qualityGate || metrics.quality_gate;
        state.metrics.reconcile = state.metrics.reconcile || metrics.control_total;
        state.metrics.uat = state.metrics.uat || {};
        state.services = serviceListToMap(services);
        state.activities = activity.activities || [];
        state.layers = {
          bronzeReady: lakehouse.bronze?.status === "ready",
          silverReady: lakehouse.silver?.status === "ready",
          goldReady: lakehouse.gold?.status === "ready",
          goldValid: Boolean(lakehouse.gold?.valid)
        };
        const hasMetrics = Boolean(metrics.available);
        if (!state.layers.goldReady) state.dashboardStatus = "Waiting for Gold";
        else if (!hasMetrics) state.dashboardStatus = "Waiting for Metrics";
        else if (!state.services.superset) state.dashboardStatus = "Superset Offline";
        else if (!state.layers.goldValid) state.dashboardStatus = "Validation Failed";
        else state.dashboardStatus = "Ready";
        state.rejectedRows = tablePayloadToObjects(rejected);
        state.goldPreview = tablePayloadToObjects(goldPreview);
        state.silverPreview = tablePayloadToObjects(silverPreview);
        state.sourceStatus = sourceStatus;
        state.pdfStatus = pdfStatus;
        state.referenceSummary = referenceSummary;
      } catch {
        try {
          const response = await fetch("/api/portal-state", { cache: "no-store" });
          if (!response.ok) throw new Error("Fallback API unavailable");
          Object.assign(state, await response.json());
        } catch {
          state.metrics = {
            reconcile: { total_piutang: CONTROL.totalPiutang, jumlah_penunggak: CONTROL.penunggak, target_total_piutang: CONTROL.totalPiutang, target_jumlah_penunggak: CONTROL.penunggak, status: "pass" },
            quality: { data_quality_score: CONTROL.qualityScore },
            dropout: { total_rows: CONTROL.totalRows, valid_rows: CONTROL.validRows, rejected_rows: CONTROL.rejectedRows, dropout_rate: CONTROL.dropoutRate },
            uat: { average_score: 4.6, category: "Sangat baik", response_count: 15 }
          };
          state.layers = { bronzeReady: false, silverReady: false, goldReady: false, goldValid: true };
          state.services = { portal: true, airflow: false, superset: false, minioConsole: false, minioApi: false, sparkMaster: false, sparkWorker: false, trino: false, postgres: false };
        }
      }
      renderAll();
      setRoute();
    }

    renderShell();
    window.addEventListener("hashchange", setRoute);
    loadState();
  </script>
